# Sao chép thành config.yaml. Kiểm tra lại tên model và đơn giá trước khi chạy thật.
# Model lập plan. Chọn nhà cung cấp bằng LLM_PROVIDER trong .env (mặc định: gemini).
gemini:
  model: gemini-3.8-flash         # xem https://ai.google.dev/gemini-api/docs/models
  fallback_models:                # dùng lần lượt khi model trên quá tải (503) hoặc hết hạn mức (429)
    - gemini-3.7-flash            # cùng đơn giá với model chính
    - gemini-3.6-flash
  max_output_tokens: 16000        # gồm cả phần "thinking" của model
  price_usd_per_mtok_input: 0.75  # giá đến hết 31/12/2026; sau đó 1.50 — xem trang pricing
  price_usd_per_mtok_output: 3.75 # giá đến hết 31/12/2026; sau đó 7.50

# Chỉ dùng khi LLM_PROVIDER=claude (cần ANTHROPIC_API_KEY).
claude:
  model: claude-sonnet-5-5        # đổi sang claude-opus-5-5 nếu cần chất lượng plan cao hơn
  max_tokens: 16000               # gồm cả phần "thinking" của model; đừng hạ xuống dưới 8000
  effort: medium                  # low | medium | high | xhigh | max
  refusal_fallback: true          # nếu model từ chối, API tự thử lại bằng model dự phòng (beta)
  price_usd_per_mtok_input: 2.0   # đơn giá của model ở trên; sửa lại nếu đổi model
  price_usd_per_mtok_output: 10.0

# Chỉ dùng khi VIDEO_PROVIDER=veo trong .env. Bảng giá ngày 01/10/2026 (USD/giây, không có gói miễn phí)
# — kiểm tra lại tại https://ai.google.dev/gemini-api/docs/pricing trước khi chạy thật:
#   veo-3.1-generate-preview        720p/1080p: 0.40   4k: 0.60
#   veo-3.1-fast-generate-preview   720p: 0.10   1080p: 0.12   4k: 0.30
#   veo-3.1-lite-generate-preview   720p: 0.05   1080p: 0.08
# Veo chỉ hỗ trợ tỉ lệ 9:16 và 16:9 (không có 1:1). 1080p/4k chỉ áp dụng cho cảnh 8 giây;
# cảnh 4 và 6 giây luôn sinh ở 720p. Veo luôn sinh kèm audio (không tắt được).
veo:
  model: veo-3.1-generate-preview # xem https://ai.google.dev/gemini-api/docs/veo
  resolution: 720p                # 720p cho nháp, 1080p cho bản chính
  generate_audio: false           # chưa dùng: Gemini API không cho tắt audio của Veo
  price_usd_per_second: null      # ĐIỀN đơn giá của model + độ phân giải ở trên trước khi chạy veo thật
  max_concurrent: 3
  job_timeout_sec: 600
  poll_interval_sec: 10
  est_clip_generation_sec: 120    # ước lượng thời gian sinh 1 clip, dùng cho màn duyệt plan

limits:
  cost_cap_per_job_usd: 5
  cost_cap_per_day_usd: 20
  max_regenerations_per_scene: 1

defaults:
  duration_sec: 30
  aspect: "9:16"
  voice: vi-female-north
  style: "clean corporate office, soft daylight, muted blue palette"

tts:
  price_usd_per_1k_chars: null

assembler:
  ffmpeg_path: ffmpeg
  ffprobe_path: ffprobe
  output_width: 1080
  output_height: 1920
  subtitle_font: "Be Vietnam Pro"
  music_dir: assets/music
  logo_path: assets/logo.png
  est_assembly_sec: 90            # ước lượng thời gian TTS + ghép video

storage:
  data_dir: data

server:
  # Tên máy chủ được phép truy cập. Thêm tên máy hoặc IP trong mạng nội bộ nếu mở từ máy khác.
  allowed_hosts: [localhost, 127.0.0.1, "::1"]
